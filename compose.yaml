services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobs_rag
      POSTGRES_USER: jobsrag
      POSTGRES_PASSWORD: jobsrag_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsrag -d jobs_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobsrag:jobsrag_dev_password@db:5432/jobs_rag
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
